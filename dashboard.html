<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4B Investment Group — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">4<span class="num">B</span> Investment Group</div>
  <div class="who">
    <span id="whoName"></span>
    <a href="#" class="logout" onclick="logout(); return false;">Log out</a>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <h2>Log a Monthly Contribution</h2>
    <form id="contribForm">
      <label for="month">Month</label>
      <input type="month" id="month" required>

      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" min="1" step="0.01" required>

      <label for="notes">Notes (optional)</label>
      <input type="text" id="notes" placeholder="e.g. Paid via M-Pesa">

      <button type="submit" class="gold">Add Contribution</button>
    </form>
    <div id="contribMsg" class="msg" style="display:none"></div>
  </div>

  <div class="card">
    <h2>My Contribution Ledger</h2>
    <table id="contribTable">
      <thead>
        <tr><th>Month</th><th>Notes</th><th class="amount">Amount</th></tr>
      </thead>
      <tbody id="contribBody"></tbody>
    </table>
    <div id="contribEmpty" class="empty" style="display:none">No contributions logged yet.</div>
    <div class="total-line">
      <div class="label">Total Contributed</div>
      <div class="value" id="totalValue">KES 0</div>
    </div>
  </div>

  <div class="card">
    <h2>Britam Earnings — Group Statements</h2>
    <div id="docsList"></div>
    <div id="docsEmpty" class="empty" style="display:none">No statements posted yet.</div>
  </div>

</div>

<script src="api.js"></script>
<script>
requireLogin();
const user = getUser();
document.getElementById("whoName").textContent = `${user.name} · File #${user.fileNumber}`;

function money(n) {
  return "KES " + Number(n || 0).toLocaleString("en-KE", { minimumFractionDigits: 2 });
}

async function loadContributions() {
  const res = await api("getMyContributions", { token: getToken() });
  const body = document.getElementById("contribBody");
  const empty = document.getElementById("contribEmpty");
  body.innerHTML = "";
  if (!res.success) return;
  if (res.contributions.length === 0) {
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    res.contributions
      .slice()
      .sort((a, b) => (a.month < b.month ? 1 : -1))
      .forEach(c => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${c.month}</td><td>${c.notes || ""}</td><td class="amount">${money(c.amount)}</td>`;
        body.appendChild(tr);
      });
  }
  document.getElementById("totalValue").textContent = money(res.total);
}

async function loadDocuments() {
  const res = await api("getDocuments", { token: getToken() });
  const list = document.getElementById("docsList");
  const empty = document.getElementById("docsEmpty");
  list.innerHTML = "";
  if (!res.success) return;
  if (res.documents.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  res.documents.forEach(d => {
    const div = document.createElement("div");
    div.className = "doc-entry";
    div.innerHTML = `
      <div class="doc-title">${d.title}</div>
      <div class="doc-meta">${d.date}${d.description ? " — " + d.description : ""}</div>
      <div class="doc-interest">Interest earned: ${money(d.interestEarned)}</div>
      ${d.fileLink ? `<div><a href="${d.fileLink}" target="_blank" rel="noopener">View statement ↗</a></div>` : ""}
    `;
    list.appendChild(div);
  });
}

document.getElementById("contribForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("contribMsg");
  const monthInput = document.getElementById("month").value; // yyyy-mm
  const amount = document.getElementById("amount").value;
  const notes = document.getElementById("notes").value.trim();

  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Saving…";

  try {
    const res = await api("addContribution", { token: getToken(), month: monthInput, amount, notes });
    if (res.success) {
      showMsg(msg, "Contribution added.", "success");
      e.target.reset();
      loadContributions();
    } else {
      showMsg(msg, res.error || "Could not add contribution", "error");
    }
  } finally {
    btn.disabled = false; btn.textContent = "Add Contribution";
  }
});

loadContributions();
loadDocuments();
</script>
</body>
</html>
