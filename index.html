<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4B Investment Group — Log In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap narrow">
  <div style="text-align:center; margin-bottom: 28px;">
    <img class="logo-hero" src="https://media-mba2-1.cdn.whatsapp.net/v/t61.24694-24/490583399_3823653537884983_4854067465339027898_n.jpg?ccb=11-4&oh=01_Q5Aa5AEltySXBpsvY-lLE_jn9wcFKEuecla-cQwkovS0sm5wnA&oe=6A66E120&_nc_sid=5e03e0&_nc_cat=106" alt="4B Investment Group logo">
    <h1 class="display">4<span style="color:var(--gold-deep)">B</span> Investment Group</h1>
    <div class="empty">Member ledger &amp; Britam earnings tracker</div>
  </div>

  <div class="card">
    <h2>Log In</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit" class="gold" style="width:100%">Log In</button>
    </form>
    <div id="msg" class="msg" style="display:none"></div>
  </div>

  <div class="nav-links">
    New member? <a href="register.html">Register here</a> — approval is needed before you can log in.
  </div>
  <div class="admin-link">
    Are you an admin? <a href="admin-login.html">Admin Login</a>
  </div>
</div>

<script src="api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Logging in…";

  try {
    const res = await api("login", { email, password });
    if (res.success && res.role === "admin") {
      api("logout", { token: res.token }); // don't leave an unused session open
      showMsg(msg, "This is a member login. Admins should use the Admin Login link below.", "error");
    } else if (res.success) {
      localStorage.setItem("4b_token", res.token);
      localStorage.setItem("4b_user", JSON.stringify({
        name: res.name, role: res.role, fileNumber: res.fileNumber
      }));
      window.location.href = "dashboard.html";
    } else {
      showMsg(msg, res.error || "Login failed", "error");
    }
  } catch (err) {
    showMsg(msg, "Could not reach the server. Check API_URL in api.js.", "error");
  } finally {
    btn.disabled = false; btn.textContent = "Log In";
  }
});
</script>
</body>
</html>
