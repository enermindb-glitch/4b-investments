<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4B Investment Group — Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap narrow">
  <div style="text-align:center; margin-bottom: 28px;">
    <h1 class="display">4<span style="color:var(--gold-deep)">B</span> Investment Group</h1>
    <div class="empty">Request membership</div>
  </div>

  <div class="card">
    <h2>Register</h2>
    <form id="regForm">
      <label for="name">Full name</label>
      <input type="text" id="name" required>

      <label for="fileNumber">File number</label>
      <input type="text" id="fileNumber" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>

      <button type="submit" class="gold" style="width:100%">Submit for Approval</button>
    </form>
    <div id="msg" class="msg" style="display:none"></div>
  </div>

  <div class="nav-links">
    Already approved? <a href="index.html">Log in</a>
  </div>
</div>

<script src="api.js"></script>
<script>
document.getElementById("regForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const payload = {
    name: document.getElementById("name").value.trim(),
    fileNumber: document.getElementById("fileNumber").value.trim(),
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  };

  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Submitting…";

  try {
    const res = await api("register", payload);
    if (res.success) {
      showMsg(msg, "Registered. An admin needs to approve your account before you can log in.", "success");
      e.target.reset();
    } else {
      showMsg(msg, res.error || "Registration failed", "error");
    }
  } catch (err) {
    showMsg(msg, "Could not reach the server. Check API_URL in api.js.", "error");
  } finally {
    btn.disabled = false; btn.textContent = "Submit for Approval";
  }
});
</script>
</body>
</html>
